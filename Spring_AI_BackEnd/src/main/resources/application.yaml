spring:
  application:
    name: ai-demo
  ai:
    ollama:
      base-url: http://localhost:11434 # ollama服务地址， 这就是默认值
      chat:
        model: qwen3:8b # 模型名称
        options:
          temperature: 0.8 # 模型温度，影响模型生成结果的随机性，越小越稳定
          keep-alive: 30m # 避免 5 分钟后卸载模型导致反复冷启动（qwen3:8b 约 5.2GB）
          num-ctx: 8192 # Ollama 默认上下文远小于模型上限 40960，长对话会被静默截断
          logits-all: true
      embedding:
        model: qwen3-embedding:0.6b
        options:
          keep-alive: 30m
    vectorstore:
      mongodb:
        initialize-schema: true #是否自动创建索引
        collection-name: springAi_vector_store #指定数据存哪个集合
        index-name: springAi_vector_index #指定用哪个索引来搜
        path-name: embedding #指定向量存在哪个字段
        metadata-fields-to-filter: chat_id #声明哪些元数据字段可过滤
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spring_ai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  data:
    mongodb:
      uri: mongodb+srv://wangyulong9316_db_user:CM3T8fyoJKnRQh0e@springaistudy.7tsej10.mongodb.net/spring_ai?retryWrites=true&w=majority
logging:
  level:
    org.springframework.ai: info # 设为 debug 会打印 eval-duration 等元数据噪音
    com.example.springai_01: debug # 本项目的日志级别
minio:
  endpoint: http://127.0.0.1:9000  # 你启动的 MinIO 地址
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: spring-ai-rag-bucket